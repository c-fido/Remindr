name: API

on:
  push:
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: remindr
          POSTGRES_PASSWORD: test
          POSTGRES_DB: remindr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remindr -d remindr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://remindr:test@localhost:5432/remindr?sslmode=disable
      JWT_SECRET: ci-test-jwt-secret
      WEB_ORIGIN: http://localhost:5173

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: api/go.sum

      - name: Install migrate
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest

      - name: Run migrations
        run: migrate -path migrations -database "$DATABASE_URL" up

      - name: Test
        run: go test ./... -count=1

      - name: Build
        run: go build -o /dev/null ./cmd/server
